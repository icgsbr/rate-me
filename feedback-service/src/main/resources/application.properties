# ----------------------------------------------------------------------------
# feedback-service configuration
# Every value has a sensible local default and can be overridden by an env var,
# so the same build runs locally, in docker-compose and in the cloud.
# ----------------------------------------------------------------------------

quarkus.application.name=feedback-service
quarkus.http.port=8086

# --- Datasource (PostgreSQL) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/feedback}

# --- Hibernate ORM ---
# The schema is owned by Flyway; Hibernate must not generate or validate DDL.
quarkus.hibernate-orm.database.generation=none

# --- Flyway (runs V1__init_schema.sql on startup) ---
quarkus.flyway.migrate-at-start=true

# --- JWT validation (distributed, against the auth-service JWKS) ---
# The issuer MUST match the auth-service JWT_ISSUER value.
mp.jwt.verify.publickey.location=${AUTH_JWKS_URL:http://localhost:8085/.well-known/jwks.json}
mp.jwt.verify.issuer=${JWT_ISSUER:auth-service}

# --- REST client for the external auth-service ---
quarkus.rest-client.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8085}

# --- Mailer (SMTP) ---
# Points at MailHog locally; mock must be false so mail is actually delivered.
quarkus.mailer.from=${MAIL_FROM:rate.me.fiap@gmail.com}
quarkus.mailer.host=${MAIL_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:rate.me.fiap@gmail.com}
quarkus.mailer.password=${MAIL_PASSWORD}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.mock=false

quarkus.log.category."io.quarkus.mailer".level=DEBUG
quarkus.log.category."io.vertx.ext.mail".level=DEBUG

# --- Application settings ---
# Default course every feedback is attached to (seeded by Flyway V1).
app.default-course-id=${DEFAULT_COURSE_ID:00000000-0000-0000-0000-000000000001}
# Recipient of low-score alerts (will come from Azure Key Vault in the cloud).
app.notification.admin-email=${ADMIN_EMAIL:rate.me.fiap@gmail.com}

# --- OpenAPI / Swagger UI ---
quarkus.swagger-ui.always-include=true
