# ----------------------------------------------------------------------------
# notification-function configuration
#
# This module is packaged as an Azure Function, so there is no HTTP server of our
# own: the Functions host owns the port. quarkus.http.port only matters for tests.
# ----------------------------------------------------------------------------

quarkus.application.name=notification-function

# Name of the Azure Function App. Also decides the packaging directory:
#   target/azure-functions/rate-me-notification-function/
quarkus.azure-functions.app-name=rate-me-notification-function

# --- Mailer (same Gmail SMTP account the report-service uses) ---
quarkus.mailer.from=${MAIL_FROM:rate.me.fiap@gmail.com}
quarkus.mailer.host=${MAIL_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:rate.me.fiap@gmail.com}
quarkus.mailer.password=${MAIL_PASSWORD}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.mock=false

# --- Alert settings ---
# admin-email       -> alerts pushed in through POST /api/notifications/critical
# alert-admin-email -> alerts raised by the log scan below; defaults to the same mailbox
app.notification.admin-email=${ADMIN_EMAIL:rate.me.fiap@gmail.com}
app.notification.alert-admin-email=${ALERT_ADMIN_EMAIL:${ADMIN_EMAIL:rate.me.fiap@gmail.com}}

# --- Log scan (scanFeedbackErrors timer) ---
# Watches the feedback-service Application Insights component for ERROR-level records.
# LOG_SCAN_SCHEDULE is read by the Functions host itself (see the %...% in @TimerTrigger),
# so it has to exist as an app setting; it is repeated here only for documentation.
app.log-scan.enabled=${LOG_SCAN_ENABLED:true}
app.log-scan.lag-seconds=${LOG_SCAN_LAG_SECONDS:120}
app.log-scan.max-lookback-minutes=${LOG_SCAN_MAX_LOOKBACK_MINUTES:60}
app.log-scan.first-run-lookback-minutes=${LOG_SCAN_FIRST_RUN_LOOKBACK_MINUTES:10}
app.log-scan.role-name=${FEEDBACK_ROLE_NAME:feedback-service}
app.log-scan.insights-app-id=${FEEDBACK_INSIGHTS_APP_ID:}
app.log-scan.insights-api-key=${FEEDBACK_INSIGHTS_API_KEY:}
