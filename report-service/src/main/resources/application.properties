# ----------------------------------------------------------------------------
# report-service configuration
# ----------------------------------------------------------------------------

quarkus.application.name=report-service
quarkus.http.port=8087

# Por padrão, o agendador local fica desativado.
# Ele não deve ser executado no ambiente de produção do Azure,
# onde o TimerTrigger da Function assume o controle.
app.report.local.cron=off

%dev.app.report.local.cron=0/30 * * * * ?
%dev.app.report.cron=0/30 * * * * ?

# Agendamento para o ambiente de produção na nuvem (Azure), usado pela @TimerTrigger.
app.report.cloud.cron=0 0 * * * *

# --- Datasource: the SAME PostgreSQL as feedback-service, read-only usage ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/feedback}

# Schema is owned by feedback-service (Flyway); never generate/validate DDL here.
quarkus.hibernate-orm.database.generation=none

# --- Mailer (MailHog locally) ---
quarkus.mailer.from=${MAIL_FROM:rate.me.fiap@gmail.com}
quarkus.mailer.host=${MAIL_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:rate.me.fiap@gmail.com}
quarkus.mailer.password=${MAIL_PASSWORD}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.mock=false

# --- Report settings ---
app.report.recipient-email=${REPORT_EMAIL:rate.me.fiap@gmail.com}
# Cron for the weekly job; "off" disables it (the report is also available on demand).
# Example to enable: 0 0 8 ? * MON  (Mondays 08:00)
app.report.cron=${REPORT_CRON:off}

# --- OpenAPI / Swagger UI ---
quarkus.swagger-ui.always-include=true
