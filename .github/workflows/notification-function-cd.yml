name: CD - Deploy Notification Function

on:
  push:
    branches: [ "main" ]
    paths:
      - 'notification-function/**'
      - '.github/workflows/notification-function-cd.yml'
  workflow_dispatch:

env:
  REGISTRY_URL: "ratemeacr.azurecr.io"
  IMAGE_NAME: "notification-function"
  FUNCTION_APP_NAME: "rate-me-notification-function"
  RESOURCE_GROUP: "rg-dev-servless-FIAP"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name $(echo "$REGISTRY_URL" | cut -d'.' -f1)

      - name: Resolve image tag (commit hash)
        id: get_tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # The Dockerfile builds from the repository root so the Maven reactor can resolve
      # the parent POM; the image already contains the Application Insights agent.
      - name: Build image
        run: |
          docker build -f notification-function/src/main/docker/Dockerfile.jvm \
            -t ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ steps.get_tag.outputs.IMAGE_TAG }} \
            -t ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push both tags
        run: |
          docker push ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ steps.get_tag.outputs.IMAGE_TAG }}
          docker push ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest

      # The Function App tracks the :latest tag, so a restart is what picks the new image up.
      - name: Restart the Function App
        run: az functionapp restart --name ${{ env.FUNCTION_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }}

      - name: Azure logout
        run: az logout
        if: always()
