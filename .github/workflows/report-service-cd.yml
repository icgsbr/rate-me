name: CI/CD - Deploy Report Service to Azure Functions

on:
  # Aciona o workflow em pushes para a branch main, mas SOMENTE se houver
  # alterações dentro da pasta 'report-service/'.
  push:
    branches: [ "main" ]
    paths:
      - 'report-service/**'

  # Permite que você execute este workflow manualmente a partir da aba Actions no GitHub.
  workflow_dispatch:

# Variáveis de ambiente usadas no workflow
env:
  ACR_NAME: "ratemeacr"
  FUNCTION_APP_NAME: "rate-me-report-service"
  RESOURCE_GROUP: "rg-dev-servless-FIAP"
  IMAGE_NAME: "report-service"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: '1. Checkout do código'
        uses: actions/checkout@v4

      - name: '2. Configurar JDK 21'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: '3. Fazer login na Azure'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: '4. Fazer login no Azure Container Registry (ACR)'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: '5. Compilar, empacotar e enviar a imagem Docker'
        run: |
          mvn -B -f report-service/pom.xml package \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=${{ env.ACR_NAME }}.azurecr.io \
            -Dquarkus.container-image.name=${{ env.IMAGE_NAME }} \
            -Dquarkus.container-image.tag=${{ github.sha }}

      - name: '6. Fazer deploy para a Azure Function'
        uses: azure/functions-container-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          resource-group: ${{ env.RESOURCE_GROUP }}
          image: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}